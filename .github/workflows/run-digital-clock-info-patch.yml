name: Run Digital Clock Info patch

on:
  push:
    paths:
      - '.github/workflows/run-digital-clock-info-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Info panel
        run: python .github/scripts/patch-dc-info.py
      - name: Verify Info panel
        run: |
          grep -q 'dc-payment-grid' index.html
          grep -q 'Donate with PayPal' index.html
          grep -q 'Donate with Stripe' index.html
      - name: Commit Info update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade Digital Clock Info design"
          git push
