name: One-time SEO metadata update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-once.yml'

permissions:
  contents: write

jobs:
  update-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Digital Clock metadata
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_bytes().decode("utf-8")
          url = "https://digitalclock.appsandgames.org/"

          text = text.replace("https://soldatix.github.io/Digital-Clock/", url)
          text = text.replace("https://raw.githubusercontent.com/Soldatix/Digital-Clock/main/Digital%20Clock%20Social.png", "https://appsandgames.org/assets/images/digital-clock.png")
          text = re.sub(r'\s*<link\s+rel="alternate"\s+hreflang="[^"]+"\s+href="[^"]+"\s*/?>', '', text)
          text = re.sub(r'<meta\s+name="author"[^>]*>', '<meta name="author" content="Apps & Games">', text, count=1)

          if f'rel="canonical" href="{url}"' not in text:
              seo = '''<meta name="robots" content="index, follow">
          <link rel="canonical" href="https://digitalclock.appsandgames.org/">
          <meta property="og:site_name" content="Apps & Games">
          <meta property="og:image:alt" content="Digital Clock app preview">
          <meta name="twitter:image:alt" content="Digital Clock app preview">
          <script type="application/ld+json">
          {
            "@context":"https://schema.org",
            "@type":"WebApplication",
            "name":"Digital Clock",
            "url":"https://digitalclock.appsandgames.org/",
            "image":"https://appsandgames.org/assets/images/digital-clock.png",
            "description":"A free multifunctional browser clock with alarms, stopwatch, countdown timer and world time zones.",
            "applicationCategory":"UtilitiesApplication",
            "operatingSystem":"Any",
            "isAccessibleForFree":true,
            "inLanguage":["en","hr","de","it","es"],
            "publisher":{"@type":"Organization","name":"Apps & Games","url":"https://appsandgames.org/"}
          }
          </script>
          '''
              marker = '<style>'
              if marker not in text:
                  raise SystemExit("Style marker not found; no SEO block inserted.")
              text = text.replace(marker, seo + marker, 1)

          path.write_bytes(text.encode("utf-8"))
          workflow = Path(".github/workflows/seo-once.yml")
          if workflow.exists():
              workflow.unlink()
      - name: Commit SEO update and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "SEO: update Digital Clock metadata"
          git push
